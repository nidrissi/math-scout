[project]
name = "math-scout"
version = "0.2.0a2"
description = "A multi-agent first-pass reader for mathematical papers."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Najib Idrissi" }]
keywords = ["latex", "mathematics", "peer-review", "llm", "anthropic", "openai"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Topic :: Text Processing :: Markup :: LaTeX",
]
# The SDK floors are the versions whose streaming and structured-output request shapes
# this code binds against. Upper bounds are deliberate: both native APIs move quickly.
dependencies = [
    "anthropic>=0.120,<1",
    "openai>=3.5,<4",
    "pydantic>=2.13,<3",
    "rich>=15,<17",
]

[project.urls]
Homepage = "https://github.com/nidrissi/math-scout"
Issues = "https://github.com/nidrissi/math-scout/issues"

[project.scripts]
math-scout = "math_scout.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/math_scout"]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.16.4"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
