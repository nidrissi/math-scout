name: Publish to PyPI

on:
    release:
        types:
            - published

permissions:
    contents: read

concurrency:
    group: pypi-${{ github.event.release.tag_name }}
    cancel-in-progress: false

jobs:
    build:
        name: Build and validate distributions
        runs-on: ubuntu-latest

        steps:
            - name: Checkout release
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

            - name: Set up Python
              uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
              with:
                  python-version: "3.14"

            - name: Install uv
              uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
              with:
                  version: "0.12.5"

            - name: Verify release tag matches package version
              env:
                  RELEASE_TAG: ${{ github.event.release.tag_name }}
              run: >-
                  python -c 'import os, sys, tomllib; version =
                  tomllib.load(open("pyproject.toml",
                  "rb"))["project"]["version"]; expected = f"v{version}"; actual
                  = os.environ["RELEASE_TAG"]; print(f"release tag: {actual};
                  package version: {version}"); sys.exit(0 if actual == expected
                  else f"expected release tag {expected}, got {actual}")'

            - name: Build source and wheel distributions
              run: uv build

            - name: Validate distribution metadata
              run: uvx twine check dist/*

            - name: Upload distributions
              uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
              with:
                  name: python-package-distributions
                  path: dist/
                  if-no-files-found: error

    publish-testpypi:
        name: Publish distributions to TestPyPI
        needs: build
        runs-on: ubuntu-latest
        environment:
            name: testpypi
            url: https://test.pypi.org/p/math-scout
        permissions:
            id-token: write

        steps:
            - name: Download distributions
              uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
              with:
                  name: python-package-distributions
                  path: dist/

            - name: Publish distributions to TestPyPI
              uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
              with:
                  repository-url: https://test.pypi.org/legacy/
                  skip-existing: true

    publish:
        name: Publish distributions to PyPI
        needs: publish-testpypi
        runs-on: ubuntu-latest
        environment:
            name: pypi
            url: https://pypi.org/p/math-scout
        permissions:
            id-token: write

        steps:
            - name: Download distributions
              uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
              with:
                  name: python-package-distributions
                  path: dist/

            - name: Publish distributions to PyPI
              uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
